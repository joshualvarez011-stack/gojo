<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOJO · Gäster</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../css/admin.css"><style>.crm{max-width:1180px;margin:auto;padding:36px 20px 80px}.crm-top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.crm-top h1{font:500 clamp(38px,6vw,64px)/1 var(--serif);margin:5px 0}.crm-search{width:min(100%,420px);border:1px solid var(--line);background:#fff;border-radius:999px;padding:13px 17px}.crm-grid{display:grid;grid-template-columns:390px 1fr;gap:14px}.crm-panel{background:#fff;border:1px solid var(--line);border-radius:16px;min-height:560px;overflow:hidden}.customer-row{width:100%;border:0;border-bottom:1px solid #eee7df;background:#fff;padding:15px 17px;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:8px}.customer-row:hover,.customer-row.active{background:#f7f1e9}.customer-row strong{display:block}.customer-row small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.customer-row span{font:500 22px var(--serif)}.detail{padding:24px}.detail h2{font:500 38px/1 var(--serif);margin:6px 0}.detail-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:10px}.crm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.crm-stats div{border:1px solid var(--line);border-radius:12px;padding:12px}.crm-stats span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.1em}.crm-stats strong{font:500 30px var(--serif)}.note-box{display:grid;gap:8px;margin:18px 0}.note-box label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.note-box textarea{min-height:90px;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}.note-actions{display:flex;justify-content:space-between;gap:12px;align-items:center}.note-actions small{color:var(--muted)}.history{margin-top:26px}.history h3{font:500 25px var(--serif)}.history-row{display:grid;grid-template-columns:90px 1fr 80px 100px;gap:10px;padding:11px 0;border-top:1px solid #eee7df;align-items:center;font-size:11px}.empty-crm{padding:50px 20px;color:var(--muted);text-align:center}.back{color:var(--muted);font-size:11px}@media(max-width:850px){.crm-grid{grid-template-columns:1fr}.crm-panel{min-height:auto}.history-row{grid-template-columns:80px 1fr 70px}.history-row .source{display:none}}</style></head><body><main class="crm"><header class="crm-top"><div><span class="kicker">GOJO HOST · CRM</span><h1>Gäster</h1><a class="back" href="./">← Till dashboard</a></div><input id="customerSearch" class="crm-search" type="search" placeholder="Sök namn, telefon eller e-post…" autocomplete="off"></header><div class="crm-grid"><section class="crm-panel"><div id="customerList"></div></section><section class="crm-panel"><div id="customerDetail" class="empty-crm">Välj en gäst för historik och anteckningar.</div></section></div></main><script type="module" src="customers.js"></script></body></html>
